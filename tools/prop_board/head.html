<title>Prop Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;600&family=Saira+Condensed:wght@600;700&display=swap">
<style>
/* Layout: header with data stamp, two tabs (Player, Trend board), one working panel at a time. */
:root {
  --bg: #f3f5f9;
  --surface: #ffffff;
  --ink: #0f1b2d;
  --muted: #566780;
  --line: #d5dce8;
  --accent: #0b6bcb;
  --accent-ink: #ffffff;
  --under: #b4c0d4;
  --up: #17804f;
  --down: #b83a27;
  --font-display: "Saira Condensed", "Arial Narrow", Impact, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1424; --surface: #142038; --ink: #e8eefb; --muted: #94a5c1; --line: #28385a;
    --accent: #5aa9ff; --accent-ink: #0c1424; --under: #3b4c6e; --up: #4cc38a; --down: #ff7a66;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1424; --surface: #142038; --ink: #e8eefb; --muted: #94a5c1; --line: #28385a;
  --accent: #5aa9ff; --accent-ink: #0c1424; --under: #3b4c6e; --up: #4cc38a; --down: #ff7a66;
  color-scheme: dark;
}
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 8px 20px; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 40px; line-height: 1; margin: 0; letter-spacing: .01em; text-transform: uppercase; }
.stamp { color: var(--muted); font-size: 13px; margin: 0; }
.stamp b { font-family: var(--font-data); font-weight: 500; color: var(--ink); }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
.tabs button { font: inherit; font-weight: 600; background: none; color: var(--muted); border: 0; border-bottom: 3px solid transparent; padding: 10px 14px; cursor: pointer; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tabs button:focus-visible, .chip:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.panel[hidden] { display: none; }
.controls { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1.2fr) minmax(0, .8fr) minmax(0, 1fr); gap: 12px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
label, .lab { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
input, select { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 9px 10px; min-width: 0; width: 100%; box-sizing: border-box; }
input#line { font-family: var(--font-data); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.who { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; }
.who h2 { font-family: var(--font-display); font-weight: 700; font-size: 30px; line-height: 1.05; margin: 0; }
.who .meta { color: var(--muted); }
.next { display: flex; flex-wrap: wrap; gap: 4px 18px; color: var(--muted); font-size: 14px; }
.next b { color: var(--ink); font-weight: 600; }
.hits { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.hit { border: 1px solid var(--line); border-radius: 4px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.hit .big { font-family: var(--font-data); font-weight: 500; font-size: 26px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.hit .sub { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.note { color: var(--muted); font-size: 13px; margin: 0; }
.chip { font: inherit; font-size: 13px; font-weight: 600; background: var(--surface); color: var(--accent); border: 1px solid var(--accent); border-radius: 999px; padding: 4px 12px; cursor: pointer; }
.chip:hover { background: var(--accent); color: var(--accent-ink); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); align-items: center; }
.sw { display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.chartbox { overflow-x: auto; position: relative; }
svg { display: block; width: 100%; min-width: 560px; height: auto; }
svg text { font-family: var(--font-data); fill: var(--muted); font-size: 11px; }
svg .val { fill: var(--ink); }
svg .bar { cursor: pointer; }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 12px; padding: 6px 9px; border-radius: 4px; white-space: nowrap; z-index: 2; }
.tip[hidden] { display: none; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); position: sticky; top: 0; background: var(--surface); }
td.n, th.n { text-align: right; font-family: var(--font-data); font-variant-numeric: tabular-nums; }
tr.pick { cursor: pointer; }
tr.pick:hover td { background: var(--bg); }
tr.pick:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; }
.up { color: var(--up); font-weight: 600; }
.down { color: var(--down); font-weight: 600; }
.filters { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
.scroll { max-height: 560px; overflow: auto; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
@media (max-width: 720px) {
  .controls { grid-template-columns: 1fr 1fr; }
  .controls .field:first-child { grid-column: 1 / -1; }
  .filters { grid-template-columns: 1fr 1fr; }
  h1 { font-size: 34px; }
}
</style>
